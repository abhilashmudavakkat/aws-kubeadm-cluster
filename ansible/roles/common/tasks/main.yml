---

- name: "Update and Upgrade the System"
  apt:
    upgrade: yes
    update_cache: yes


- name: "Set Hostnames for Nodes"
  hostname:
    name: "{{ node_hostname }}"


- name: "Load {{ kernel_modules }} kernel Modules and Make Sure it is Loaded After Reboots"
  community.general.modprobe:
    name: "{{ item }}"
    state: present
    persistent: present
  loop: "{{ kernel_modules }}"


- name: "Configure Network Settings For Kubernetes"
  ansible.posix.sysctl:
    name: "{{ item }}"
    value: '1'
    sysctl_set: true
    sysctl_file: /etc/sysctl.d/k8s.conf
    state: present
    reload: true
  loop: "{{ kernel_params }}"


- name: "Install {{ packages.container_runtime }}"
  apt:
    name: "{{ packages.container_runtime }}"
    state: present


- name: "Create a Directory For Containerd Config"
  file:
    path: /etc/containerd
    state: directory
    mode: '0755'


- name: "Create Containerd Default Configuration"
  shell: containerd config default | sudo tee /etc/containerd/config.toml > /dev/null
  args:
    creates: /etc/containerd/config.toml


- name: "Replace Default Containerd Configuration with Desired Configuration"
  template:
    src: config.toml.tmpl
    dest: /etc/containerd/config.toml
  notify: 
    - "Containerd Restart"


- name: "Enable and Start Containerd Service"
  service:
    name: containerd
    state: "started"
    enabled: yes


- name: "Install  {{ packages.kubernetes_dependencies }} for Kubernetes"
  apt:
    name: "{{ packages.kubernetes_dependencies }}"
    state: present


- name: "Download Kubernetes Repo Signing Key"
  get_url:
    url: https://pkgs.k8s.io/core:/stable:/{{ k8s_version }}/deb/Release.key
    dest: /etc/apt/keyrings/kubernetes-apt-keyring.asc


- name: "Add Kubernetes Repository"
  apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.asc] https://pkgs.k8s.io/core:/stable:/{{ k8s_version }}/deb/ /"
    filename: kubernetes
    state: present
    update_cache: true

